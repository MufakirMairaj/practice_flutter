workflows:
  shared-dev-build:
    name: Android APK & iOS Dev Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'dev'
          include: true
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Accept Android Licenses
        script: yes | sdkmanager --licenses

      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Build Android APK (Release)
        script: |
          flutter build apk --release --build-number=$BUILD_NUMBER
          # Renames the apk to include the build number for better organization
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/DoctorSummary_dev_build_$BUILD_NUMBER.apk

      - name: Build iOS (Release)
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/ios/iphoneos/*.app

    publishing:
      email:
        recipients:
          - mufakirblackaht@gmail.com
        notify:
          success: true
          failure: true